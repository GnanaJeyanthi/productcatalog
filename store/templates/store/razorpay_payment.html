{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-credit-card"></i> Complete Payment</h5>
                </div>
                <div class="card-body text-center">
                    <h4 class="mb-3">Order Total: ₹{{ cart_total }}</h4>
                    <p class="text-muted mb-4">Please complete your payment to confirm the order</p>

                    <button id="rzp-button1" class="btn btn-success btn-lg">
                        <i class="bi bi-credit-card"></i> Pay Now ₹{{ cart_total }}
                    </button>

                    <div class="mt-4">
                        <small class="text-muted">
                            <i class="bi bi-shield-check"></i> Secure payment powered by Razorpay
                        </small>
                    </div>
                </div>
            </div>

            <div class="mt-3 text-center">
                <a href="{% url 'checkout' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Change Payment Method
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ amount }}",
    "currency": "INR",
    "name": "Product Catalog",
    "description": "Order Payment",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        // Handle success
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = "{% url 'verify_payment' %}";

        var razorpay_order_id = document.createElement('input');
        razorpay_order_id.type = 'hidden';
        razorpay_order_id.name = 'razorpay_order_id';
        razorpay_order_id.value = response.razorpay_order_id;
        form.appendChild(razorpay_order_id);

        var razorpay_payment_id = document.createElement('input');
        razorpay_payment_id.type = 'hidden';
        razorpay_payment_id.name = 'razorpay_payment_id';
        razorpay_payment_id.value = response.razorpay_payment_id;
        form.appendChild(razorpay_payment_id);

        var razorpay_signature = document.createElement('input');
        razorpay_signature.type = 'hidden';
        razorpay_signature.name = 'razorpay_signature';
        razorpay_signature.value = response.razorpay_signature;
        form.appendChild(razorpay_signature);

        document.body.appendChild(form);
        form.submit();
    },
    "prefill": {
        "name": "{{ order.full_name }}",
        "email": "{{ order.email }}",
        "contact": "{{ order.phone }}"
    },
    "theme": {
        "color": "#007bff"
    }
};
var rzp1 = new Razorpay(options);

document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock %}
